[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear,
# DJ Django-specific checks, C4 comprehensions, SIM simplifications.
select = ["E", "W", "F", "I", "UP", "B", "DJ", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated by django-admin and intentionally left as-is.
"craftcv/settings.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
