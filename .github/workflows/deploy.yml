name: Deploy Sandbox

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Deploy to Sandbox
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::897729111286:role/craftcv-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: 897729111286

      - name: Find CraftCV EC2 instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=craftcv-backend" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ]; then
            echo "No running CraftCV instance found."
            exit 1
          fi

          echo "Found instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy through AWS Systems Manager
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CraftCV backend" \
            --parameters 'commands=[
              "cd /opt/craftcv",
              "git fetch origin develop",
              "git reset --hard origin/develop",
              "sudo docker compose -f compose.deploy.yaml up -d --build",
              "sudo docker compose -f compose.deploy.yaml exec -T web python manage.py migrate",
              "sudo docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Show deployment result
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Errors:StandardErrorContent
            }'