name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Same entry point as the pre-commit hook, so local and CI results match.
      - name: Lint
        run: sh scripts/check.sh lint

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same entry points as the pre-push hook.
      - name: Build
        run: sh scripts/check.sh build

      - name: Test
        run: sh scripts/check.sh test

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Building on every pull request keeps the image from rotting unnoticed.
      - name: Build the image
        run: docker build --tag craftcv-backend:ci .

      - name: Django system checks inside the image
        run: docker run --rm craftcv-backend:ci python manage.py check
